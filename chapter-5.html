<!DOCTYPE html>
<html>

<head>
    <title>Add Two Numbers</title>
</head>

<body>

    <script>
        var num1 = 3;
        var num2 = 5;

        var sum = num1 + num2;

        document.write("Sum of " + num1 + " and " + num2 + " is " + sum + "<br>");


        // ques nmbr 3 //

        var num1 = 3;
        var num2 = 5;

        var result = num1 - num2;

        document.write("Subtraction of " + num1 + " and " + num2 + " is " + result + "<br>");

        // Multipication //

        var num1 = 3;
        var num2 = 5;

        var result = num1 * num2;

        document.write("Multiplication of " + num1 + " and " + num2 + " is " + result + "<br>");


        // Division //

        var num1 = 3;
        var num2 = 5;

        var result = num1 / num2;

        document.write("Division of " + num1 + " and " + num2 + " is " + result + "<br>");

        // Modulus //

        var num1 = 3;
        var num2 = 5;

        var result = num1 % num2;

        document.write("Modulus of " + num1 + " and " + num2 + " is " + result + "<br>");


        // ques number 4 //  (a)

        var num = 10;

        document.write(num + "<br>");


        // b //

        var num;

        document.write("Value after variable declaration is: " + num + "<br>");





    </script>

</body>

</html>
